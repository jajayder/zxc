- name: Instalando MMA
  hosts: DynaInvent
  gather_facts: no
  vars:
    workspace_id: "08d52ffe-0b4d-4d24-8b31-eb6d60ddb0b2"
    workspace_key: "eDKvib67OWdMMBVOebzS2h96coFXiS9/5OjMDjtlC/UFAKX0+PtDbycmQurQNXVVBdyD9fvkpS9mTT1JlYaESQ=="
    mma_download_url: "https://go.microsoft.com/fwlink/?LinkID=828603"
    mma_installer_path: "C:\\temp\\MMASetup-AMD64.exe"
    mma_extract_path: "C:\\temp\\MMAExtract"
    ansible_user: "{{ ad_user if var_amb_ad == 'Production' else ad_np_user }}"
    ansible_password: "{{ ad_pass if var_amb_ad == 'Production' else ad_np_pass }}"
  tasks:
    - name: bloco install MMA
      block:
        - name: Baixar o instalador do MMA
          ansible.windows.win_get_url:
            url: "{{ mma_download_url }}"
            dest: "{{ mma_installer_path }}"
            validate_certs: no

        - name: Extrair e instalar Microsoft Monitoring Agent
          ansible.windows.win_shell: |
            C:\temp\MMASetup-AMD64.exe /Q /C /T:C:\temp\MMAExtract

        - name: Instalar Microsoft Monitoring Agent
          ansible.windows.win_shell: |
            Start-Process -FilePath C:\\temp\\MMAExtract\\Setup.exe `
            -ArgumentList '"/qn ADD_OPINSIGHTS_WORKSPACE=1 OPINSIGHTS_WORKSPACE_ID="{{ workspace_id }}" OPINSIGHTS_WORKSPACE_KEY="{{ workspace_key }}" AcceptEndUserLicenseAgreement=1"' `
            -Wait
          args:
            executable: powershell.exe
      when: var_mma == 'sim' | default(false)

- name: Instalando Defender
  collections:
    - community.windows
    - ansible.windows
  hosts: DynaInvent
  vars:
     ansible_user: "{{ ad_user }}"
     ansible_password: "{{ ad_pass }}"
  tasks:
    - name: Bloco install Defender
      block:
        - name: Instalando Defender
          ansible.windows.win_shell: echo Y | C:\temp\WindowsDefenderATPLocalOnboardingScript_2019-2025.cmd
      when: var_defender == 'sim' | default(false)

- name: Validando instaladores
  collections:
    - community.windows
    - ansible.windows
  hosts: DynaInvent
  vars:
     ansible_user: "{{ ad_user }}"
     ansible_password: "{{ ad_pass }}"
  tasks:
    - name: Validando instaladores
      ansible.windows.win_powershell:
        script: |
          $installers = Get-Proccess -Name "msiexec", "Setup" -ErrorAction SilentlyContinue
          return [bool]$installers
      register: active_installer
      until: active_installer.output[0] == false
      retries: 30
      delay: 10

- name: aguardando conclusão do installer
  hosts: DynaInvent
  gather_facts: no
  vars:
     ansible_user: "{{ ad_user }}"
     ansible_password: "{{ ad_pass }}"
  tasks:
    - name: encerrando msiecec
      ansible.windows.win_shell: |
        Get-Process msiexec -ErrorAction SilentlyContinue | Stop-Process -Force
    - name: aguardando conclusão do installer
      ansible.windows.win_shell: |
        if (Get-Process msiexec -ErrorAction SilentlyContinue) {
          exit 1
        }
        exit 0
      register: msiexec_status
      retries: 10
      delay: 10
      until: msiexec_status.rc == 0
      changed_when: false

- name: install agent Zabbix
  collections:
    - community.windows
    - ansible.windows
  hosts: DynaInvent
  vars:
     ansible_user: "{{ ad_user }}"
     ansible_password: "{{ ad_pass }}"
  tasks:
    - name: Bloco install Zabbix
      block:
        - name: variavel zabbix
          ansible.windows.win_environment:
            name: zabbix_server_ip
            value: '10.83.104.76,10.83.190.4,10.83.190.5'
            state: present
            level: machine

        - name: instala agente zabbix
          ansible.windows.win_command: C:\\temp\\zabbix_agent2-7.0.25_install.bat
          args:
            chdir: C:\temp\
    
        - name: Altera restart service recovery
          ansible.windows.win_shell: |
            sc.exe failure "Zabbix Agent 2" reset= 86400 actions= restart/120000/restart/120000/restart/120000
      when: var_zabbix == 'sim' | default(false)

