- name: Deploy nova VM
  collections:
    - community.vmware
    - community.general
    - microsoft.ad
    - ansible.windows
  
  vars:
    vmware_hosts:
       LAN 1: mgvcentaplp3.energisa.corp
       LAN 2: mgvcentaplp6.energisa.corp
       LAN 3: mgvcentaplp7.energisa.corp
       OCI: vcenter-energisa-ocvs1.sddc.vcp.oci.oraclecloud.com
       DMZ: mgvcentaplp1.dmz.energisa.corp
       GIS: mgvcentaplp1.energisa.corp
       GIS NP: mgvcentaplp2.energisa.corp
       CE: cevcentaplp1.scl.corp
       
  hosts: all

  tasks:
    - name: Get URL e acesso a LAN Vmware
      community.vmware.vmware_guest:
        hostname: "{{ vmware_hosts[var_ambiente | trim] }}"
        username: "{{ user_vmware }}"
        password: "{{ pass_vmware }}"
        validate_certs: false
        name: "{{ hostname }}"
        template: >-
          {{
            {
              'Windows 2019': 'Template_Server_2019_AUTOMACAO',
              'Windows 2022': 'Template_Server_2022_AUTOMACAO',
              'Windows 2025': 'Template_Server_2025_AUTOMACAO'
            }[template_name]
          }}
        datacenter: >-
          {{
            {
              'LAN 3':'VxRail-Datacenter',
              'OCI':'oci-w01dc',
              'GIS':'VxRail-Datacenter',
              'CE': 'Datacenter - Eusebio'
            }[var_ambiente]
          }}
        annotation: "{{ vm_notes }}"
        folder: >-
          {{
            {
              'LAN 3':'LAN - HMG',
              'OCI':'OCI - TST',
              'GIS':'Automation-DEPLOYEDs'
            }[var_ambiente]
          }}
        cluster: >-
          {{ 
            {
              'LAN 3': 'VxRail-Virtual-SAN-Cluster-LAN3',
              'OCI': 'oci01-w01-consolidated01-X9',
              'GIS': 'VxRail-Virtual-SAN-Cluster-3fb472b2-9472-4f81-91d2-f11e9f8eb534'
            }[var_ambiente]
          }}
        datastore: >-
          {{ 
            {
              'LAN 3': 'VxRail-Virtual-SAN-Datastore-LAN3',
              'GIS': 'VxRail-Virtual-SAN-Datastore-3fb472b2-9472-4f81-91d2-f11e9f8eb534',
              'CE': 'vms-storage',
              'OCI': 'workload-02'
            }[var_ambiente]
          }}
        hardware:
          memory_mb: "{{ var_memory_mb * 1024 }}"
          num_cpus: "{{ var_num_cpus }}"
          scsi: paravirtual
        networks:
          - name: "{{ var_vlan }}"
            network: "{{ var_vlan }}"
            label: "{{ var_vlan }}"
            device_type: vmxnet3
            start_connected: true
            connected: true
            type: static
            ip: "{{ var_ip }}"
            netmask: "{{ var_mask }}"
            gateway: "{{ var_gateway }}"
            domain: "{{ var_ad }}"
            state: present
        customization:
          hostname: "{{ hostname }}"
          domain: "{{ var_ad }}"
          dns_servers: >-
            {{
              {
                'ENERGISA.CORP': ['10.83.23.27','10.83.23.30'],
                'SCL.CORP': ['10.83.23.26','10.83.23.32']
              }[var_ad] 
            }}
          password: senha
          timezone: "065"
          # newsid: true
          runonce:
            - powershell.exe -ExecutionPolicy Unrestricted -File C:\Windows\Temp\ConfigureRemotingForAnsible.ps1 -ForceNewSSLCert -EnableCredSSP
        wait_for_customization: true
        state: poweredon
        wait_for_ip_address: true

      delegate_to: localhost
      register: vm_deploy

    - name: Debug deploy da VM
      ansible.builtin.debug:
        var: vm_deploy
      when: vm_deploy.failed

    - name: Aguardando SSH disponível
      ansible.builtin.wait_for_connection:
        timeout: 300
      register: resultadossh
      delegate_facts: true
      delegate_to: localhost

    - name: Debug resultado SSH
      debug:
        msg: "{{ resultadossh }}"

    - name: Validação do Deploy da VM
      community.vmware.vmware_guest_tools_wait:
        hostname: "{{ vmware_hosts[var_ambiente | trim] }}"
        username: "{{ user_vmware }}"
        password: "{{ pass_vmware }}"
        validate_certs: false
        name: "{{ hostname }}"
      register: tools_status
      until: tools_status.failed == false
      retries: 10
      delay: 20

    - name: Adicionando no host ao inventario dinamico
      ansible.builtin.add_host:
        name: "{{ hostname }}"
        groups: "DynaInvent"
        ansible_host: "{{ var_ip }}"
        ansible_user: "Administrator"
        ansible_password: senha
        ansible_connection: "winrm"
        ansible_port: 5985
        ansible_winrm_transport: "ntlm"
        ansible_winrm_server_cert_validation: "ignore"
       
- name: Aplicando updates
  hosts: DynaInvent
  gather_facts: true
  vars:
    ansible_user: "Administrator"
    ansible_password: "senha"

  collections:
    - ansible.windows

  tasks:
    - name: Aplicando Update do  Wndows
      ansible.windows.win_updates:
        category_names:
          - CriticalUpdates
          - SecurityUpdates
        state: installed
        reboot: true
      ignore_errors: true
      ignore_unreachable: true

