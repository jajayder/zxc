- name: Inserindo ao domínio {{ var_ad }}
  hosts: DynaInvent
  gather_facts: false
  collections:
    - community.vmware
    - community.general
    - microsoft.ad
    - ansible.windows

  vars:
    ansible_user: "Administrator"
    ansible_password: "senha"
  
  tasks:
    - name: Inserir ao domínio
      microsoft.ad.membership:
        dns_domain_name: "{{ var_ad }}"
        hostname: "{{ hostname }}"
        domain_admin_user: "{{ ad_user }}"
        domain_admin_password: "{{ ad_pass }}"
        domain_ou_path: >-
          OU=Aplicacoes,
          OU={{ var_amb_ad }},
          OU=T1_Servers,
          DC={{ {'ENERGISA.CORP':'ENERGISA','SCL.CORP':'SCL'}[var_ad] }},
          DC=CORP
        state: domain
      register: domain_join
      until: domain_join is success
      retries: 5
      delay: 10
      when: ad_boolean == 'sim' | default(true)
 
    - name: Reiniciar após entrar no domínio
      ansible.builtin.win_reboot:
        reboot_timeout: 600
        connect_timeout: 15
        pre_reboot_delay: 10
        post_reboot_delay: 30
        test_command: whoami
      when:
        - domain_join.reboot_required | default(false)
        - ad_boolean == 'sim' | default(true)
 
    - name: Validar ingresso no domínio
      win_shell: "(Get-WmiObject Win32_ComputerSystem).Domain"
      register: domain_check
      when: ad_boolean == 'sim' | default(true)
 
    - name: Mostrar domínio atual
      debug:
        msg: "Host está no domínio: {{ domain_check.stdout }}"
      when: ad_boolean == 'sim' | default(true)

    - name: aguardar restart
      ansible.windows.win_reboot:
        msg: "Aguardando restart SO"
        post_reboot_delay: 60        
        reboot_timeout: 600
        msg: "Aguardando restart do SO"

