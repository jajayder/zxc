---
# Variaveis temporarias desta iteracao.
- name: Inicializar contexto do usuario
  ansible.builtin.set_fact:
    current_locations: "{{ secret_inventory | selectattr('username', 'equalto', current_user) | list }}"
    current_ad: {}
    current_valid_passwords: []
    current_new_password: ''
    current_ad_status: 'UNKNOWN'
    current_ad_detail: ''
    current_user_rotation_attempted: false
    current_user_rotation_success: false
    current_user_secret_failures: []
  no_log: true

- name: Consultar AD para obter expiracao
  ansible.windows.win_powershell:
    path: "{{ playbook_dir }}/files/ad_get_user_expiry.ps1"
    parameters:
      Username: "{{ current_user }}"
      Domain: "{{ ad_domain }}"
    error_action: stop
  register: ad_query
  failed_when: false
  no_log: true

- name: Registrar falha de consulta ao AD
  ansible.builtin.set_fact:
    current_ad_status: 'AD_LOOKUP_FAILED'
    current_ad_detail: "{{ ad_query.error | default(ad_query.msg | default('Falha ao consultar o AD')) | string }}"
  when: ad_query.failed | default(false)
  no_log: true

- name: Registrar dados retornados pelo AD
  ansible.builtin.set_fact:
    current_ad: "{{ ad_query.result }}"
    current_ad_status: "{{ ad_query.result.status }}"
  when:
    - not (ad_query.failed | default(false))
    - ad_query.result is defined
    - ad_query.result.status is defined
  no_log: true

- name: Validar credenciais encontradas nos Secrets contra o AD
  ansible.windows.win_powershell:
    path: "{{ playbook_dir }}/files/ad_validate_password.ps1"
    parameters:
      Username: "{{ current_user }}"
      Domain: "{{ ad_domain }}"
      Password: "{{ candidate.password }}"
    error_action: stop
  loop: "{{ current_locations }}"
  loop_control:
    loop_var: candidate
    label: "{{ candidate.cluster }}/{{ candidate.namespace }}/{{ candidate.secret }}"
  register: password_validation_results
  failed_when: false
  no_log: true
  when:
    - current_ad_status == 'ROTATE'

- name: Guardar senhas que foram validadas no AD
  ansible.builtin.set_fact:
    current_valid_passwords: "{{ current_valid_passwords + [ candidate_result.item.password ] }}"
  loop: "{{ password_validation_results.results | default([]) }}"
  loop_control:
    loop_var: candidate_result
  when:
    - current_ad_status == 'ROTATE'
    - not (candidate_result.failed | default(false))
    - candidate_result.result is defined
    - candidate_result.result.valid is defined
    - candidate_result.result.valid | bool
  no_log: true

- name: Remover duplicidade de senhas validas
  ansible.builtin.set_fact:
    current_valid_passwords: "{{ current_valid_passwords | unique }}"
  when: current_ad_status == 'ROTATE'
  no_log: true

- name: Marcar senha nao compativel
  ansible.builtin.set_fact:
    current_ad_status: 'PASSWORD_NOT_COMPATIBLE'
    current_ad_detail: 'Nenhuma senha encontrada nos Secrets foi validada com sucesso no AD.'
  when:
    - current_ad_status == 'ROTATE'
    - current_valid_passwords | length == 0
  no_log: true

- name: Gerar nova senha forte
  ansible.builtin.set_fact:
    current_new_password: >-
      {{ lookup(
        'community.general.random_string',
        length=16,
        min_lower=1,
        min_upper=1,
        min_numeric=1,
        min_special=1,
        override_special=password_special_chars,
        similar_chars=''
      ) }}
  when:
    - current_ad_status == 'ROTATE'
    - current_valid_passwords | length > 0
  no_log: true

- name: Alterar senha do proprio usuario no AD
  ansible.windows.win_powershell:
    path: "{{ playbook_dir }}/files/ad_change_password.ps1"
    parameters:
      Username: "{{ current_user }}"
      Domain: "{{ ad_domain }}"
      OldPassword: "{{ current_valid_passwords[0] }}"
      NewPassword: "{{ current_new_password }}"
    error_action: stop
  register: password_change_result
  failed_when: false
  no_log: true
  when:
    - current_ad_status == 'ROTATE'
    - current_valid_passwords | length > 0

- name: Tratar falha na troca do AD
  ansible.builtin.set_fact:
    current_ad_status: 'AD_CHANGE_FAILED'
    current_ad_detail: "{{ password_change_result.error | default(password_change_result.msg | default('Falha ao alterar a senha no AD')) | string }}"
  when:
    - current_ad_status == 'ROTATE'
    - password_change_result.failed | default(false)
  no_log: true

- name: Confirmar sucesso da troca no AD
  ansible.builtin.set_fact:
    current_user_rotation_attempted: true
    current_user_rotation_success: true
  when:
    - current_ad_status == 'ROTATE'
    - not (password_change_result.failed | default(false))
    - password_change_result.result is defined
    - password_change_result.result.changed | default(false) | bool
  no_log: true

- name: Atualizar todos os Secrets do usuario apos AD OK
  ansible.builtin.include_tasks: update_secret.yml
  loop: "{{ current_locations }}"
  loop_control:
    loop_var: secret_location
    label: "{{ secret_location.cluster }}/{{ secret_location.namespace }}/{{ secret_location.secret }}"
  when: current_user_rotation_success

# Relatorio sem senha.
- name: Adicionar linhas do usuario ao relatorio
  ansible.builtin.set_fact:
    report_rows: "{{ report_rows + [ {
      'username': current_user,
      'cluster': location.cluster,
      'environment': location.environment,
      'namespace': location.namespace,
      'secret': location.secret,
      'days_remaining': (current_ad.days_remaining | default('N/A')),
      'status': (
        'UPDATED' if (current_user_rotation_success and location_update_status | default('') == 'UPDATED')
        else 'SECRET_UPDATE_FAILED' if (current_user_rotation_success and location_update_status | default('') == 'SECRET_UPDATE_FAILED')
        else current_ad_status
      ),
      'detail': (
        location_update_detail | default('Senha alterada no AD e Secret atualizado')
        if current_user_rotation_success
        else current_ad_detail | default('')
      )
    } ] }}"
  loop: "{{ current_locations }}"
  loop_control:
    loop_var: location
  vars:
    location_update_status: "{{ location_update_status_by_secret[location.cluster ~ '|' ~ location.namespace ~ '|' ~ location.secret] | default('') }}"
    location_update_detail: "{{ location_update_detail_by_secret[location.cluster ~ '|' ~ location.namespace ~ '|' ~ location.secret] | default('') }}"
  no_log: true
