- name: Varrer rede e registrar hosts no AWX
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Executar varredura Nmap no range IP
      community.general.nmap:
        address: "10.83.102.0/24"
        ports: "22"
      register: nmap_result

    - name: Adicionar hosts ativos no inventario do AWX
      awx.awx.host:
        name: "{{ item }}"
        inventory: "NMAP Inventory"
        state: present
        enabled: true
        variables:
          ansible_host: "{{ item }}"
          discovered_by: "nmap_sweep"
      loop: "{{ nmap_result.nmap_hosts }}"
      when: nmap_result.nmap_hosts is defined

---
