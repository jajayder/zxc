- name: Buscar contas em Secrets
  hosts: localhost
  gather_facts: false

  collections:
    - kubernetes.core

  vars:
    applications_prefix: "^aplic-"

  tasks:

    - name: Buscar secrets
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        validate_certs: false
      register: secret_data

    - name: Inicializar lista de contas
      set_fact:
        application_accounts: []

    - name: Extrair username e password
      set_fact:
        application_accounts: >-
          {{
            application_accounts +
            [
              {
                'namespace': item.metadata.namespace,
                'secret_name': item.metadata.name,
                'username': item.data.username | b64decode | trim,
                'password': item.data.password | b64decode | trim
              }
            ]
          }}
      loop: "{{ secret_data.resources }}"
      when:
        - item.type | default('') == 'Opaque'
        - item.data is defined
        - "'username' in item.data"
        - "'password' in item.data"
        - (item.data.username | b64decode | trim) is match(applications_prefix)
      no_log: true

    - name: Obter usuarios únicos
      set_fact:
        usuarios_unicos: >-
          {{
            application_accounts
            | map(attribute='username')
            | unique
            | list
          }}

    - name: Inicializar agrupamento
      set_fact:
        usuarios_agrupados: []

    - name: Agrupar usuarios
      set_fact:
        usuarios_agrupados: "{{ usuarios_agrupados + [ resultado ] }}"
      vars:
        contas_usuario: >-
          {{
            application_accounts
            | selectattr('username','equalto',item)
            | list
          }}
        resultado:
          username: "{{ item }}"
          password: "{{ contas_usuario | first | default({}) | json_query('password') }}"
          references: "{{ contas_usuario }}"
      loop: "{{ usuarios_unicos }}"
      when:
        - contas_usuario | length > 0
      no_log: true

    - name: Compartilhar fatos com host windows
      set_fact:
        usuarios_agrupados: "{{ usuarios_agrupados }}"
      delegate_to: 10.83.103.61
      delegate_facts: true

- name: Processar contas
  hosts: windows
  gather_facts: false

  collections:
    - ansible.windows
    - community.general

  vars:
    dias_limite: 10

  tasks:

    - name: Consultar expiração no AD
      ansible.windows.win_powershell:
        script: |

          Import-Module ActiveDirectory

          try {

            $senhaexpira = Get-ADUser `
              -Identity "{{ item.username }}" `
              -Server "scl.corp" `
              -Properties PasswordNeverExpires,"msDS-UserPasswordExpiryTimeComputed"

            if (-not $senhaexpira) {
              throw "Usuario nao encontrado"
            }

            if ($senhaexpira.PasswordNeverExpires) {

              $resultado = @{
                Username   = "{{ item.username }}"
                ExpireDate = "N/A"
                DaysLeft   = "senha nunca expira"
                Success    = $true
              }

            } else {

              $expiradata =
                :FromFileTime(
                  $senhaexpira."msDS-UserPasswordExpiryTimeComputed"
                )

              $diasrestantes =
                :Floor(
                  ($expiradata - (Get-Date)).TotalDays
                )

              $resultado = @{
                Username   = "{{ item.username }}"
                ExpireDate = $expiradata.ToString("dd-MM-yyyy HH:mm:ss")
                DaysLeft   = $diasrestantes
                Success    = $true
              }
            }

          }
          catch {

            $resultado = @{
              Username   = "{{ item.username }}"
              ExpireDate = ""
              DaysLeft   = ""
              Success    = $false
              Error      = $_.Exception.Message
            }

          }

          $resultado | ConvertTo-Json -Compress

      loop: "{{ hostvars[inventory_hostname].usuarios_agrupados | default([]) }}"
      register: dataexpirasenha_ad
      changed_when: false

    #################################################################
    # NORMALIZA RESULTADOS AD
    #################################################################

    - name: Inicializar resultados AD
      set_fact:
        resultados_ad: []

    - name: Tratar retorno do PowerShell
      set_fact:
        resultados_ad: "{{ resultados_ad + [ registro ] }}"
      vars:
        ps_json: "{{ item.output | join('') | from_json }}"
        registro:
          username: "{{ item.item.username }}"
          password: "{{ item.item.password }}"
          references: "{{ item.item.references }}"
          expire_date: "{{ ps_json.ExpireDate }}"
          days_left: "{{ ps_json.DaysLeft }}"
          success: "{{ ps_json.Success }}"
      loop: "{{ dataexpirasenha_ad.results }}"
      when:
        - item.output is defined
        - item.output | length > 0

    #################################################################
    # TODOS USUÁRIOS
    #################################################################

    - name: Inicializar relatorio completo
      set_fact:
        relatorio_todos: []

    - name: Expandir usuarios x secrets
      set_fact:
        relatorio_todos: "{{ relatorio_todos + [ registro ] }}"
      vars:
        registro:
          username: "{{ item.0.username }}"
          namespace: "{{ item.1.namespace }}"
          secret_name: "{{ item.1.secret_name }}"
          expire_date: "{{ item.0.expire_date }}"
          days_left: "{{ item.0.days_left }}"
      loop: "{{ resultados_ad | subelements('references') }}"

    #################################################################
    # SOMENTE VENCENDO
    #################################################################

    - name: Inicializar usuarios vencendo
      set_fact:
        usuarios_vencendo: []

    - name: Filtrar usuarios vencendo
      set_fact:
        usuarios_vencendo: "{{ usuarios_vencendo + [ item ] }}"
      loop: "{{ resultados_ad }}"
      when:
        - item.success | bool
        - item.days_left != "senha nunca expira"
        - item.days_left | string | length > 0
        - (item.days_left | int) >= 0
        - (item.days_left | int) <= dias_limite

    #################################################################
    # AQUI ENTRAM AS TASKS DE TROCA DE SENHA
    #################################################################

#    - name: Gerar senha
#    - name: Alterar senha
#    - name: Atualizar secrets
#
#    register: secrets_updates

    #################################################################
    # RELATORIO ALTERACOES
    #################################################################

    - name: Inicializar relatorio alteracoes
      set_fact:
        relatorio_alteracoes: []

    - name: Montar relatorio alteracoes
      set_fact:
        relatorio_alteracoes: "{{ relatorio_alteracoes + [ registro ] }}"
      vars:
        registro:
          username: "{{ item.item.0.username }}"
          namespace: "{{ item.item.1.namespace }}"
          secret_name: "{{ item.item.1.secret_name }}"
      loop: "{{ secrets_updates.results | default([]) }}"
      when:
        - not (item.failed | default(false))

    #################################################################
    # HTML TODOS
    #################################################################

    - name: Montar HTML todos os usuarios
      set_fact:
        html_todosuserpods: |
          <html>
          <body>

          <h3>Todos os usuários encontrados</h3>

          <table border="1" cellspacing="0" cellpadding="4">
            <tr bgcolor="#8FAADC">
              <th>Usuário</th>
              <th>Namespace</th>
              <th>Secret</th>
              <th>Expiração</th>
              <th>Dias Restantes</th>
            </tr>

            {% for item in relatorio_todos %}
            <tr>
              <td>{{ item.username }}</td>
              <td>{{ item.namespace }}</td>
              <td>{{ item.secret_name }}</td>
              <td>{{ item.expire_date }}</td>
              <td>{{ item.days_left }}</td>
            </tr>
            {% endfor %}

          </table>

          <br>
          Total de registros: {{ relatorio_todos | length }}

          </body>
          </html>

    #################################################################
    # HTML ALTERADOS
    #################################################################

    - name: Montar HTML alteracoes
      set_fact:
        html_userpods: |
          <html>
          <body>

          {% if relatorio_alteracoes | length == 0 %}

          <h3 style="color:green">
            Nenhuma senha precisou ser alterada.
          </h3>

          {% else %}

          <h3>Usuários com senha alterada</h3>

          <table border="1" cellspacing="0" cellpadding="4">
            <tr bgcolor="#8FAADC">
              <th>Usuário</th>
              <th>Namespace</th>
              <th>Secret</th>
            </tr>

            {% for item in relatorio_alteracoes %}
            <tr>
              <td>{{ item.username }}</td>
              <td>{{ item.namespace }}</td>
              <td>{{ item.secret_name }}</td>
            </tr>
            {% endfor %}

          </table>

          <br>
          Total alterados: {{ relatorio_alteracoes | length }}

          {% endif %}

          </body>
          </html>

    #################################################################
    # EMAIL
    #################################################################

    - name: Enviar email
      community.general.mail:
        host: mail.energisa.com.br
        port: 25
        subtype: html
        from: iac-infra@energisa.com.br
        to:
          - jayder.carneiro@energisaterceiros.com.br
        subject: >
          Relatório Credenciais OCPD1 -
          {{ now(fmt='%d/%m/%Y') }}
        body: |
          {{ html_todosuserpods }}

          <br><br>
          <hr>
          <br><br>

          {{ html_userpods }}

      delegate_to: localhost
      run_once: true
